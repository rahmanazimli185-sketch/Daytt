<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gündəlik">
<meta name="theme-color" content="#F3F5FC">
<title>Gündəlik Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FC;--s1:#ffffff;--s2:#F1F3FB;--s3:#E6EAFB;
  --border:#E7EAF5;--bh:#B8C0E6;
  --ac:#6366F1;--ac2:#8B5CF6;
  --gold:#F5A524;--teal:#14B8A6;--rose:#F43F5E;--violet:#8B5CF6;--sky:#3B82F6;--lime:#22C55E;
  --text:#1E2347;--muted:#8B91B3;--muted2:#6B7194;
  --sh:0 4px 18px rgba(99,102,241,.08);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;display:flex;flex-direction:column}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 0 0,rgba(99,102,241,.14),transparent 45%),radial-gradient(circle at 100% 20%,rgba(20,184,166,.12),transparent 40%),radial-gradient(circle at 50% 100%,rgba(244,63,94,.08),transparent 45%);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;overflow:hidden}
.header{padding:1rem 1.1rem .4rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-brand{font-size:1.45rem;font-weight:800;letter-spacing:-.03em;color:var(--text);display:flex;align-items:center;gap:.55rem}
.brand-dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--teal));animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(.7)}}
.hright{display:flex;align-items:center;gap:.7rem}
.header-clock .time{font-size:1.15rem;font-weight:700;color:var(--ac);line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.header-clock .date{font-size:.64rem;color:var(--muted2);margin-top:.15rem;text-align:right}
.bell{width:40px;height:40px;border-radius:14px;border:none;background:var(--s1);box-shadow:var(--sh);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.bell svg,.tabbt svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bell.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.statbar{display:flex;gap:.6rem;padding:.6rem 1.1rem;flex-shrink:0;overflow-x:auto}
.statbar::-webkit-scrollbar{display:none}
.scard{background:var(--s1);border-radius:18px;padding:.7rem .9rem;display:flex;flex-direction:column;align-items:flex-start;min-width:84px;flex:1;box-shadow:var(--sh)}
.scard-val{font-size:1.2rem;font-weight:800;line-height:1;margin-bottom:.3rem;letter-spacing:-.02em}
.scard-lbl{font-size:.62rem;color:var(--muted2);font-weight:500;white-space:nowrap}
.prog-wrap{height:6px;background:var(--s3);margin:.2rem 1.1rem .3rem;border-radius:10px;overflow:hidden;flex-shrink:0}
.prog-fill{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--ac),var(--teal));transition:width .5s ease}
.tabnav{order:99;display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);margin:0 .7rem calc(.7rem + env(safe-area-inset-bottom));border-radius:24px;padding:.35rem;flex-shrink:0;box-shadow:0 8px 30px rgba(99,102,241,.18)}
.tabbt{flex:1;min-width:0;padding:.5rem .1rem;border:none;background:transparent;color:var(--muted);font-family:inherit;font-size:.58rem;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.2rem;border-radius:18px;transition:all .2s}
.tabbt .ti{display:flex}
.tabbt.active{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 12px rgba(99,102,241,.35)}
.panels{flex:1;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;padding:.7rem 1.1rem 1rem;display:none;-webkit-overflow-scrolling:touch}
.panel.active{display:block;animation:fin .25s ease}
@keyframes fin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel::-webkit-scrollbar{width:0}
.sec-title{font-size:1rem;font-weight:700;margin-bottom:.7rem;display:flex;align-items:center;gap:.4rem}
.irow{display:flex;gap:.5rem;margin-bottom:.7rem;flex-wrap:wrap}
input,select,textarea{background:var(--s1);border:1.5px solid transparent;border-radius:14px;color:var(--text);padding:.7rem .9rem;font-family:inherit;font-size:.86rem;outline:none;transition:all .2s;-webkit-appearance:none;box-shadow:var(--sh)}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
input[type=text],input[type=number]{flex:1;min-width:0}
.btn{padding:.7rem 1.1rem;border-radius:14px;border:none;font-family:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-gold{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.3)}
.btn-teal{background:linear-gradient(135deg,var(--teal),#2DD4BF);color:#fff;box-shadow:0 4px 12px rgba(20,184,166,.3)}
.btn-ghost{background:var(--s2);color:var(--muted)}
.del-btn{background:var(--s2);border:none;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:50%;font-size:.7rem;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.del-btn:active{color:#fff;background:var(--rose)}
.fstrip{display:flex;gap:.4rem;margin-bottom:.8rem;flex-wrap:wrap}
.fbtn{padding:.4rem .85rem;border-radius:20px;border:none;background:var(--s1);color:var(--muted2);font-size:.7rem;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:var(--sh)}
.fbtn.active{background:var(--ac);color:#fff}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted)}
.empty .ei{font-size:2.2rem;margin-bottom:.4rem;opacity:.5}
.empty p{font-size:.78rem}
.task-item{background:var(--s1);border-radius:18px;padding:.85rem .95rem;display:flex;align-items:center;gap:.7rem;cursor:pointer;margin-bottom:.55rem;box-shadow:var(--sh)}
.task-item:active{transform:scale(.99)}
.task-item.done{opacity:.5}
.task-item.done .task-text{text-decoration:line-through;color:var(--muted)}
.chk{width:24px;height:24px;min-width:24px;border-radius:50%;border:2px solid var(--bh);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700}
.task-item.done .chk{background:var(--lime);border-color:var(--lime)}
.task-text{flex:1;font-size:.86rem;font-weight:500;line-height:1.3}
.task-time{font-size:.68rem;color:var(--ac);font-weight:700;background:var(--s3);padding:.2rem .5rem;border-radius:8px;flex-shrink:0}
.tag{font-size:.62rem;font-weight:700;padding:.2rem .55rem;border-radius:20px;flex-shrink:0}
.pri-urgent{background:rgba(244,63,94,.12);color:var(--rose)}
.pri-normal{background:rgba(245,165,36,.16);color:#D4880A}
.pri-low{background:var(--s2);color:var(--muted2)}
.notes-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem}
.note-card{background:var(--s1);border:2px solid transparent;border-radius:20px;padding:.95rem;position:relative;box-shadow:var(--sh)}
.note-card h4{font-size:.84rem;font-weight:700;margin-bottom:.35rem;padding-right:1.4rem;line-height:1.3}
.note-card p{font-size:.75rem;color:var(--muted2);line-height:1.5}
.note-card .nd{font-size:.62rem;color:var(--muted);margin-top:.6rem}
.note-del{position:absolute;top:.6rem;right:.6rem;background:var(--s2);border:none;color:var(--muted);cursor:pointer;font-size:.65rem;width:22px;height:22px;border-radius:50%}
.sched-row{display:flex;gap:.6rem;min-height:46px}
.sched-hr{width:42px;min-width:42px;font-size:.68rem;font-weight:600;color:var(--muted);padding-top:.45rem;text-align:right}
.sched-line{flex:1;border-top:1.5px dashed var(--border);padding:.25rem 0 .25rem .3rem}
.sched-event{border-left:4px solid var(--gold);background:var(--s1);border-radius:12px;padding:.45rem .7rem;font-size:.78rem;font-weight:500;display:flex;justify-content:space-between;align-items:center;margin-bottom:.25rem;box-shadow:var(--sh)}
.sched-event.c2{border-left-color:var(--teal)}
.sched-event.c3{border-left-color:var(--rose)}
.sched-event.c4{border-left-color:var(--violet)}
.fin-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;margin-bottom:.9rem}
.fin-card{background:var(--s1);border-radius:18px;padding:.8rem .5rem;text-align:center;box-shadow:var(--sh)}
.fc-val{font-size:1.05rem;font-weight:800;margin-bottom:.2rem}
.fc-lbl{font-size:.62rem;color:var(--muted2);font-weight:500}
.fin-list{display:flex;flex-direction:column;gap:.5rem}
.fin-item{background:var(--s1);border-radius:16px;padding:.7rem .85rem;display:flex;align-items:center;gap:.65rem;box-shadow:var(--sh)}
.fin-icon{width:36px;height:36px;border-radius:12px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.fin-info{flex:1;min-width:0}
.fin-name{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fin-cat{font-size:.65rem;color:var(--muted2)}
.fin-amt{font-size:.84rem;font-weight:700;flex-shrink:0}
.fin-amt.income{color:var(--lime)}
.fin-amt.expense{color:var(--rose)}
.cat-bar{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem}
.cat-bar-lbl{font-size:.7rem;width:78px;color:var(--muted2);font-weight:500;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-bar-track{flex:1;background:var(--s3);border-radius:100px;height:8px;overflow:hidden}
.cat-bar-fill{height:100%;border-radius:100px;transition:width .5s ease}
.cat-bar-val{font-size:.68rem;color:var(--muted2);font-weight:600;flex-shrink:0;width:42px;text-align:right}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:.7rem}
.dash-mini{background:var(--s1);border-radius:20px;padding:.95rem;box-shadow:var(--sh)}
.dash-mini h4{font-size:.72rem;color:var(--muted2);font-weight:700;margin-bottom:.6rem;display:flex;align-items:center;gap:.4rem}
.dash-mini h4::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ac)}
.dash-grid .dash-mini:nth-child(2) h4::before{background:var(--teal)}
.dash-row{display:flex;align-items:center;gap:.45rem;padding:.4rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.dash-row:last-child{border-bottom:none}
.dash-row span{font-size:.76rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;z-index:9999}
#loadingScreen.hidden{display:none}
.ldots{display:flex;gap:.5rem}
.ldots span{width:11px;height:11px;border-radius:50%;animation:ldot .9s ease-in-out infinite}
.ldots span:nth-child(1){background:var(--ac)}
.ldots span:nth-child(2){background:var(--teal);animation-delay:.15s}
.ldots span:nth-child(3){background:var(--rose);animation-delay:.3s}
@keyframes ldot{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--s1);color:var(--ac);padding:.55rem 1.2rem;border-radius:20px;font-size:.78rem;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 6px 20px rgba(99,102,241,.22)}
.toast.show{opacity:1}
#banner{position:fixed;top:-120px;left:.8rem;right:.8rem;background:var(--s1);border-radius:20px;padding:.9rem 1rem;display:flex;gap:.7rem;align-items:center;z-index:10000;box-shadow:0 10px 34px rgba(99,102,241,.3);transition:top .4s cubic-bezier(.2,.9,.3,1.2);border-left:5px solid var(--ac)}
#banner.show{top:.8rem}
#banner b{display:block;font-size:.84rem}
#banner span{font-size:.76rem;color:var(--muted2)}
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="ldots"><span></span><span></span><span></span></div>
  <p style="font-size:.78rem;font-weight:500;color:var(--muted2)">Yüklənir...</p>
</div>

<div id="banner"></div>
<div id="toast" class="toast">💾 Saxlanıldı</div>

<div class="app">
  <div class="header">
    <div class="header-brand"><div class="brand-dot"></div>Gündəlik</div>
    <div class="hright"><button class="bell" id="bellBtn" onclick="askNotif()" aria-label="Bildiriş"><svg viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 21h4"/></svg></button><div class="header-clock">
      <div class="time" id="clock">--:--</div>
      <div class="date" id="clockDate">—</div>
    </div></div>
  </div>

  <div class="statbar">
    <div class="scard"><div class="scard-val" id="st-tasks" style="color:var(--sky)">0/0</div><div class="scard-lbl">Tapşırıq</div></div>
    <div class="scard"><div class="scard-val" id="st-habits" style="color:var(--lime)">0</div><div class="scard-lbl">Təlim</div></div>
    <div class="scard"><div class="scard-val" id="st-bal" style="color:var(--gold)">₼0</div><div class="scard-lbl">Balans</div></div>
    <div class="scard"><div class="scard-val" id="st-notes" style="color:var(--violet)">0</div><div class="scard-lbl">Qeyd</div></div>
  </div>

  <div class="prog-wrap"><div class="prog-fill" id="progFill" style="width:0%"></div></div>

  <div class="tabnav">
    <button class="tabbt active" data-tab="dashboard" onclick="switchTab('dashboard',this)"><span class="ti"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10.5V20h13v-9.5"/></svg></span>İcmal</button>
    <button class="tabbt" data-tab="tasks" onclick="switchTab('tasks',this)"><span class="ti"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></svg></span>Tapşırıq</button>
    <button class="tabbt" data-tab="notes" onclick="switchTab('notes',this)"><span class="ti"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg></span>Qeydlər</button>
    <button class="tabbt" data-tab="schedule" onclick="switchTab('schedule',this)"><span class="ti"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Cədvəl</button>
    <button class="tabbt" data-tab="habits" onclick="switchTab('habits',this)"><span class="ti"><svg viewBox="0 0 24 24"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5c-.8 0-1.5-.7-1.5-1.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg></span>Təlimlər</button>
    <button class="tabbt" data-tab="finance" onclick="switchTab('finance',this)"><span class="ti"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg></span>Maliyyə</button>
  </div>

  <div class="panels">

    <!-- DASHBOARD -->
    <div class="panel active" id="tab-dashboard">
      <div class="dash-grid">
        <div class="dash-mini">
          <h4>Tapşırıqlar</h4>
          <div id="dash-tasks"></div>
        </div>
        <div class="dash-mini">
          <h4>Bu gün təlimlər</h4>
          <div id="dash-habits"></div>
        </div>
      </div>
      <div class="dash-mini">
        <h4>Maliyyə</h4>
        <div style="display:flex;gap:.5rem;margin-top:.4rem">
          <div style="flex:1;text-align:center">
            <div style="font-weight:800;font-size:1.05rem;color:var(--lime)" id="dash-inc">₼0</div>
            <div style="font-size:.6rem;color:var(--muted2)">Gəlir</div>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-weight:800;font-size:1.05rem;color:var(--rose)" id="dash-exp">₼0</div>
            <div style="font-size:.6rem;color:var(--muted2)">Xərc</div>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-weight:800;font-size:1.05rem" id="dash-bal">₼0</div>
            <div style="font-size:.6rem;color:var(--muted2)">Balans</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TASKS -->
    <div class="panel" id="tab-tasks">
      <div class="irow">
        <input type="text" id="taskIn" placeholder="Yeni tapşırıq...">
        <input type="time" id="taskTime" style="width:96px">
      </div>
      <div class="irow">
        <select id="taskPri" style="flex:1">
          <option value="urgent">🔴 Təcili</option>
          <option value="normal" selected>🟡 Normal</option>
          <option value="low">⚪ Aşağı</option>
        </select>
        <button class="btn btn-gold" onclick="addTask()">+ Əlavə et</button>
      </div>
      <div class="fstrip">
        <button class="fbtn active" onclick="setTF('all',this)">Hamısı</button>
        <button class="fbtn" onclick="setTF('pending',this)">Gözləyən</button>
        <button class="fbtn" onclick="setTF('done',this)">Tamamlanmış</button>
        <button class="fbtn" onclick="setTF('urgent',this)">🔴 Təcili</button>
      </div>
      <div id="taskList"></div>
    </div>

    <!-- NOTES -->
    <div class="panel" id="tab-notes">
      <div class="irow" style="flex-direction:column">
        <input type="text" id="noteTitle" placeholder="Başlıq...">
        <textarea id="noteBody" placeholder="Məzmun..." style="min-height:68px;resize:vertical;width:100%"></textarea>
        <div style="display:flex;gap:.45rem">
          <select id="noteColor" style="flex:1">
            <option value="var(--teal)">🟢 Yaşıl</option>
            <option value="var(--gold)">🟡 Sarı</option>
            <option value="var(--rose)">🔴 Qırmızı</option>
            <option value="var(--violet)">🟣 Bənövşəyi</option>
          </select>
          <button class="btn btn-teal" onclick="addNote()">+ Əlavə et</button>
        </div>
      </div>
      <div class="notes-grid" id="notesList"></div>
    </div>

    <!-- SCHEDULE -->
    <div class="panel" id="tab-schedule">
      <div class="irow">
        <input type="time" id="schedTime" style="width:96px">
        <input type="text" id="schedName" placeholder="Tədbir adı...">
      </div>
      <div class="irow">
        <select id="schedCol" style="flex:1">
          <option value="">🟡 Sarı</option>
          <option value="c2">🟢 Yaşıl</option>
          <option value="c3">🔴 Qırmızı</option>
          <option value="c4">🟣 Bənövşəyi</option>
        </select>
        <button class="btn btn-gold" onclick="addSched()">+ Əlavə et</button>
      </div>
      <div id="schedGrid"></div>
    </div>

    <!-- TƏLİMLƏR -->
    <div class="panel" id="tab-habits">
      <div class="irow" style="flex-direction:column">
        <input type="text" id="habitName" placeholder="Təlim başlığı...">
        <div style="display:flex;gap:.5rem">
          <input type="datetime-local" id="habitDate" style="flex:1;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:.58rem .8rem;font-family:'DM Sans',sans-serif;font-size:.85rem;outline:none">
          <button class="btn btn-gold" onclick="addHabit()">+ Əlavə et</button>
        </div>
      </div>
      <div id="habitGrid"></div>
    </div>

    <!-- FINANCE -->
    <div class="panel" id="tab-finance">
      <div class="fin-summary">
        <div class="fin-card"><div class="fc-val" id="fin-inc" style="color:var(--lime)">₼0</div><div class="fc-lbl">Gəlir</div></div>
        <div class="fin-card"><div class="fc-val" id="fin-exp" style="color:var(--rose)">₼0</div><div class="fc-lbl">Xərc</div></div>
        <div class="fin-card"><div class="fc-val" id="fin-bal" style="color:var(--gold)">₼0</div><div class="fc-lbl">Balans</div></div>
      </div>
      <div style="background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:.82rem;margin-bottom:.85rem">
        <div style="display:flex;flex-direction:column;gap:.45rem">
          <input type="text" id="finName" placeholder="Ad...">
          <div style="display:flex;gap:.45rem">
            <input type="number" id="finAmt" placeholder="₼ Məbləğ" step="0.01">
            <select id="finType" style="flex:1">
              <option value="income">📈 Gəlir</option>
              <option value="expense" selected>📉 Xərc</option>
            </select>
          </div>
          <div style="display:flex;gap:.45rem">
            <select id="finCat" style="flex:1">
              <option value="Ərzaq">🛒 Ərzaq</option>

<script>
// ══════════════════════════════════════════
//  IndexedDB — Chrome PWA-da heç vaxt
//  silinmir. localStorage-dən fərqli olaraq
//  sistem tərəfindən təmizlənmir.
// ══════════════════════════════════════════
var DB_NAME = 'GundelikProDB';
var DB_VER  = 1;
var STORE   = 'appdata';
var db      = null;

function openDB(callback) {
  var req = indexedDB.open(DB_NAME, DB_VER);
  req.onupgradeneeded = function(e) {
    e.target.result.createObjectStore(STORE);
  };
  req.onsuccess = function(e) {
    db = e.target.result;
    callback();
  };
  req.onerror = function() {
    // IndexedDB açılmadısa localStorage-a düş
    console.warn('IndexedDB açılmadı, localStorage istifadə edilir');
    db = null;
    callback();
  };
}

function dbSave(key, val, cb) {
  if (db) {
    var tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = function() { if(cb) cb(); };
    tx.onerror = function() { lsSave(key, val); if(cb) cb(); };
  } else {
    lsSave(key, val); if(cb) cb();
  }
}

function dbLoad(key, cb) {
  if (db) {
    var tx = db.transaction(STORE, 'readonly');
    var req = tx.objectStore(STORE).get(key);
    req.onsuccess = function() {
      var val = req.result;
      if (val === undefined) {
        // IndexedDB-də yoxdursa localStorage-ə bax
        val = lsLoad(key);
      }
      cb(val);
    };
    req.onerror = function() { cb(lsLoad(key)); };
  } else {
    cb(lsLoad(key));
  }
}

// localStorage fallback
function lsSave(k, v) {
  try { localStorage.setItem('gp_'+k, JSON.stringify(v)); } catch(e) {}
}
function lsLoad(k) {
  try { var v=localStorage.getItem('gp_'+k); return v?JSON.parse(v):null; } catch(e) { return null; }
}

// Hamısını saxla
function saveKey(key, val) {
  if (db) {
    try {
      var tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(val, key);
    } catch(e) { lsSave(key, val); }
  } else {
    lsSave(key, val);
  }
  // Hər ikisini saxla (double backup)
  lsSave(key, val);
  showToast();
}

// Toast bildiriş
var toastTimer = null;
function showToast() {
  var t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1500);
}

// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
var tasks=[], notes=[], schedules=[], habits=[], finances=[];
var taskFilter='all', finFilter='all';

// ══════════════════════════════════════════
// CLOCK
// ══════════════════════════════════════════
var AZ_DAYS=['Bazar','B.ertəsi','Ç.axşamı','Çərşənbə','C.axşamı','Cümə','Şənbə'];
var AZ_MONTHS=['Yan','Fev','Mar','Apr','May','İyn','İyl','Avq','Sen','Okt','Noy','Dek'];
function tick(){
  var n=new Date();
  document.getElementById('clock').textContent=
    n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0');
  document.getElementById('clockDate').textContent=
    AZ_DAYS[n.getDay()]+', '+n.getDate()+' '+AZ_MONTHS[n.getMonth()];
}
setInterval(tick,1000); tick();

// ══════════════════════════════════════════
// TAB
// ══════════════════════════════════════════
function switchTab(name,el){
  document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('active');});
  document.querySelectorAll('.tabbt').forEach(function(b){b.classList.remove('active');});

  if(name==='dashboard') renderDashboard();
}

// ══════════════════════════════════════════
// STATS
// ══════════════════════════════════════════
function updateStats(){
  var total=tasks.length, done=tasks.filter(function(t){return t.done;}).length;
  var pct=total>0?Math.round(done/total*100):0;
  document.getElementById('st-tasks').textContent=done+'/'+total;
  document.getElementById('progFill').style.width=pct+'%';
  var today=todayKey();
  document.getElementById('st-habits').textContent=habits.length;
  document.getElementById('st-notes').textContent=notes.length;
  var inc=finances.filter(function(f){return f.type==='income';}).reduce(function(s,f){return s+f.amount;},0);
  var exp=finances.filter(function(f){return f.type==='expense';}).reduce(function(s,f){return s+f.amount;},0);
  var bal=inc-exp;
  document.getElementById('st-bal').textContent='₼'+bal.toFixed(0);
  document.getElementById('st-bal').style.color=bal>=0?'var(--gold)':'var(--rose)';
}

// ══════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════
function renderDashboard(){
  var dt=document.getElementById('dash-tasks');
  var pending=tasks.filter(function(t){return !t.done;}).slice(0,5);
  if(!pending.length) dt.innerHTML='<p style="font-size:.73rem;color:var(--muted);padding:.3rem 0">Tapşırıq yoxdur</p>';
  else dt.innerHTML=pending.map(function(t){
    return '<div class="dash-row" onclick="toggleTask('+t.id+');renderDashboard();updateStats()">'+
      '<span style="font-size:.78rem">⬜</span><span>'+esc(t.text)+'</span></div>';
  }).join('');

  var today=todayKey();
  var dh=document.getElementById('dash-habits');
  if(!habits.length) dh.innerHTML='<p style="font-size:.73rem;color:var(--muted);padding:.3rem 0">Təlim yoxdur</p>';
  else dh.innerHTML=habits.slice(0,5).map(function(h){
    return '<div class="dash-row">'+
      '<span>'+h.icon+'</span><span>'+esc(h.name)+'</span></div>';
  }).join('');

  var inc=finances.filter(function(f){return f.type==='income';}).reduce(function(s,f){return s+f.amount;},0);
  var exp=finances.filter(function(f){return f.type==='expense';}).reduce(function(s,f){return s+f.amount;},0);
  document.getElementById('dash-inc').textContent='₼'+inc.toFixed(2);
  document.getElementById('dash-exp').textContent='₼'+exp.toFixed(2);
  var bEl=document.getElementById('dash-bal');
  bEl.textContent='₼'+(inc-exp).toFixed(2);
  bEl.style.color=(inc-exp)>=0?'var(--lime)':'var(--rose)';
}

// ══════════════════════════════════════════
// TASKS
// ══════════════════════════════════════════
function addTask(){
  var v=document.getElementById('taskIn').value.trim(); if(!v) return;
  tasks.unshift({id:Date.now(),text:v,pri:document.getElementById('taskPri').value,time:document.getElementById('taskTime').value,done:false});
  saveKey('tasks', tasks);
  document.getElementById('taskIn').value='';
  document.getElementById('taskTime').value='';
  renderTasks(); updateStats();
}
function toggleTask(id){
  for(var i=0;i<tasks.length;i++){if(tasks[i].id===id){tasks[i].done=!tasks[i].done;break;}}
  saveKey('tasks', tasks); renderTasks(); updateStats();
}
function deleteTask(id){
  tasks=tasks.filter(function(t){return t.id!==id;});
  saveKey('tasks', tasks); renderTasks(); updateStats();
}
function setTF(f,el){
  taskFilter=f;
  document.querySelectorAll('#tab-tasks .fbtn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active'); renderTasks();
}
var PRI_LABELS={urgent:'Təcili',normal:'Normal',low:'Aşağı'};
function renderTasks(){
  var list=tasks;
  if(taskFilter==='pending') list=tasks.filter(function(t){return !t.done;});
  else if(taskFilter==='done') list=tasks.filter(function(t){return t.done;});
  else if(taskFilter==='urgent') list=tasks.filter(function(t){return t.pri==='urgent';});
  var el=document.getElementById('taskList');
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">✓</div><p>Tapşırıq tapılmadı</p></div>';return;}
  el.innerHTML=list.map(function(t){
    return '<div class="task-item'+(t.done?' done':'')+'" onclick="toggleTask('+t.id+')">'+
      '<div class="chk">'+(t.done?'✓':'')+'</div>'+
      '<span class="task-text">'+esc(t.text)+'</span>'+
      (t.time?'<span class="task-time">'+t.time+'</span>':'')+
      '<span class="tag pri-'+t.pri+'">'+PRI_LABELS[t.pri]+'</span>'+
      '<button class="del-btn" onclick="event.stopPropagation();deleteTask('+t.id+')">✕</button></div>';
  }).join('');
}

// ══════════════════════════════════════════
// NOTES
// ══════════════════════════════════════════
function addNote(){
  var t=document.getElementById('noteTitle').value.trim();
  var b=document.getElementById('noteBody').value.trim();
  if(!t&&!b) return;
  notes.unshift({id:Date.now(),title:t||'Başlıqsız',body:b,color:document.getElementById('noteColor').value,date:new Date().toLocaleDateString('az-AZ')});
  saveKey('notes', notes);
  document.getElementById('noteTitle').value='';
  document.getElementById('noteBody').value='';
  renderNotes(); updateStats();
}
function deleteNote(id){
  notes=notes.filter(function(n){return n.id!==id;});
  saveKey('notes', notes); renderNotes(); updateStats();
}
function renderNotes(){
  var el=document.getElementById('notesList');
  if(!notes.length){el.innerHTML='<div class="empty" style="grid-column:1/-1"><div class="ei">📝</div><p>Qeyd yoxdur</p></div>';return;}
  el.innerHTML=notes.map(function(n){
    return '<div class="note-card" style="border-color:'+(n.color||'var(--teal)')+'44">'+
      '<button class="note-del" onclick="deleteNote('+n.id+')">✕</button>'+
      '<h4 style="color:'+(n.color||'var(--teal)')+'">'+esc(n.title)+'</h4>'+
      '<p>'+esc(n.body)+'</p>'+
      '<div class="nd">'+n.date+'</div></div>';
  }).join('');
}

// ══════════════════════════════════════════
// SCHEDULE
// ══════════════════════════════════════════
function addSched(){
  var h=document.getElementById('schedTime').value;
  var n=document.getElementById('schedName').value.trim();
  if(!h||!n) return;
  schedules.push({id:Date.now(),time:h,name:n,col:document.getElementById('schedCol').value});
  schedules.sort(function(a,b){return a.time.localeCompare(b.time);});
  saveKey('schedules', schedules);
  document.getElementById('schedName').value=''; renderSchedule();
}
function deleteSched(id){
  schedules=schedules.filter(function(s){return s.id!==id;});
  saveKey('schedules', schedules); renderSchedule();
}
function renderSchedule(){
  var html='';
  for(var h=6;h<=22;h++){
    var hStr=h.toString().padStart(2,'0')+':00';
    var evs=schedules.filter(function(s){return s.time.slice(0,2)===h.toString().padStart(2,'0');});
    html+='<div class="sched-row"><div class="sched-hr">'+hStr+'</div><div class="sched-line">'+
      evs.map(function(e){
        return '<div class="sched-event '+e.col+'"><span>'+esc(e.name)+'</span>'+
          '<button class="del-btn" onclick="deleteSched('+e.id+')">✕</button></div>';
      }).join('')+'</div></div>';
  }
  document.getElementById('schedGrid').innerHTML=html;
}

// ══════════════════════════════════════════
// HABITS
// ══════════════════════════════════════════
var DAYS_SHORT=['B.E','Ç.A','Çər','C.A','Cüm','Şnb','Baz'];
function todayKey(){return new Date().toISOString().slice(0,10);}
function getWeekDates(){
  var today=new Date(),week=[];
  for(var i=6;i>=0;i--){var d=new Date(today);d.setDate(d.getDate()-i);week.push(d.toISOString().slice(0,10));}
  return week;
}
function addHabit(){
  var name=document.getElementById('habitName').value.trim(); if(!name) return;
  var dt=document.getElementById('habitDate').value;
  var displayDate='';
  if(dt){
    var d=new Date(dt);
    var months=['Yan','Fev','Mar','Apr','May','İyn','İyl','Avq','Sen','Okt','Noy','Dek'];
    var h=d.getHours().toString().padStart(2,'0');
    var m=d.getMinutes().toString().padStart(2,'0');
    displayDate=d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+', '+h+':'+m;
  }
  habits.push({id:Date.now(),name:name,icon:'📖',date:displayDate,rawDate:dt});
  saveKey('habits', habits);
  document.getElementById('habitName').value='';
  document.getElementById('habitDate').value='';
  renderHabits(); updateStats();
}
function toggleHabitDay(id,date){
  for(var i=0;i<habits.length;i++){
    if(habits[i].id===id){
      habits[i].checked=habits[i].checked||{};
      habits[i].checked[date]=!habits[i].checked[date]; break;
    }
  }
  saveKey('habits', habits); renderHabits(); updateStats();
}
function deleteHabit(id){
  habits=habits.filter(function(h){return h.id!==id;});
  saveKey('habits', habits); renderHabits(); updateStats();
}
function calcStreak(h){
  var s=0,today=new Date();
  for(var i=0;i<30;i++){
    var d=new Date(today);d.setDate(d.getDate()-i);
    if(h.checked&&h.checked[d.toISOString().slice(0,10)]) s++; else break;
  }
  return s;
}
function renderHabits(){
  var el=document.getElementById('habitGrid');
  if(!habits.length){el.innerHTML='<div class="empty"><div class="ei">📖</div><p>Təlim əlavə edilməyib</p></div>';return;}
  var iconColors={'📖':'var(--teal)','💪':'var(--rose)','🧠':'var(--violet)','🎯':'var(--gold)','✍️':'var(--sky)','🎵':'var(--lime)','💻':'var(--teal)','🌍':'var(--gold)','🔬':'var(--violet)'};
  el.innerHTML='<div class="notes-grid">'+habits.map(function(h){
    var color=iconColors[h.icon]||'var(--teal)';
    return '<div class="note-card" style="border-color:'+color+'44">'+
      '<button class="note-del" onclick="deleteHabit('+h.id+')" style="color:var(--muted)">✕</button>'+
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding-right:20px">'+
        '<span style="font-size:1.1rem">📖</span>'+
        '<h4 style="color:'+color+';margin:0;font-size:.82rem;line-height:1.3;font-weight:600">'+esc(h.name)+'</h4>'+
      '</div>'+
      (h.date?
        '<div style="display:flex;align-items:center;gap:5px;background:var(--s2);border-radius:7px;padding:5px 8px">'+
          '<span style="font-size:.75rem">📅</span>'+
          '<span style="font-size:.72rem;color:var(--muted2);font-family:monospace">'+esc(h.date)+'</span>'+
        '</div>'
      :'')+
    '</div>';
  }).join('')+'</div>';
}

// ══════════════════════════════════════════
// FINANCE
// ══════════════════════════════════════════
var CAT_COLORS={Ərzaq:'var(--gold)',Nəqliyyat:'var(--sky)',Əyləncə:'var(--violet)',Sağlamlıq:'var(--lime)',Geyim:'var(--rose)',Maaş:'var(--teal)',Digər:'var(--muted2)'};
function addFinance(){
  var name=document.getElementById('finName').value.trim();
  var amt=parseFloat(document.getElementById('finAmt').value);
  if(!name||!amt||isNaN(amt)) return;
  finances.unshift({id:Date.now(),name:name,amount:amt,type:document.getElementById('finType').value,category:document.getElementById('finCat').value,date:new Date().toLocaleDateString('az-AZ')});
  saveKey('finances', finances);
  document.getElementById('finName').value='';
  document.getElementById('finAmt').value='';
  renderFinance(); updateStats();
}
function deleteFinance(id){
  finances=finances.filter(function(f){return f.id!==id;});
  saveKey('finances', finances); renderFinance(); updateStats();
}
function setFF(f,el){
  finFilter=f;
  document.querySelectorAll('#tab-finance .fbtn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active'); renderFinance();
}
function renderFinance(){
  var inc=finances.filter(function(f){return f.type==='income';}).reduce(function(s,f){return s+f.amount;},0);
  var exp=finances.filter(function(f){return f.type==='expense';}).reduce(function(s,f){return s+f.amount;},0);
  var bal=inc-exp;
  document.getElementById('fin-inc').textContent='₼'+inc.toFixed(2);
  document.getElementById('fin-exp').textContent='₼'+exp.toFixed(2);
  document.getElementById('fin-bal').textContent='₼'+bal.toFixed(2);
  document.getElementById('fin-bal').style.color=bal>=0?'var(--lime)':'var(--rose)';
  var cats={};
  finances.filter(function(f){return f.type==='expense';}).forEach(function(f){cats[f.category]=(cats[f.category]||0)+f.amount;});
  var keys=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];});
  var maxV=keys.length?cats[keys[0]]:1;
  document.getElementById('catBars').innerHTML=keys.length?keys.map(function(c){
    return '<div class="cat-bar">'+
      '<div class="cat-bar-lbl">'+c+'</div>'+
      '<div class="cat-bar-track"><div class="cat-bar-fill" style="width:'+Math.round(cats[c]/maxV*100)+'%;background:'+(CAT_COLORS[c]||'var(--muted2)')+'"></div></div>'+
      '<div class="cat-bar-val">₼'+cats[c].toFixed(0)+'</div></div>';
  }).join(''):'<p style="font-size:.76rem;color:var(--muted)">Hələ xərc yoxdur</p>';
  var list=finFilter==='income'?finances.filter(function(f){return f.type==='income';}):
    finFilter==='expense'?finances.filter(function(f){return f.type==='expense';}):finances;
  var el=document.getElementById('finList');
  if(!list.length){el.innerHTML='<div class="empty"><div class="ei">💰</div><p>Əməliyyat yoxdur</p></div>';return;}
  el.innerHTML=list.map(function(f){
    return '<div class="fin-item">'+
      '<div class="fin-icon">'+(f.type==='income'?'📈':'📉')+'</div>'+
      '<div class="fin-info"><div class="fin-name">'+esc(f.name)+'</div><div class="fin-cat">'+f.category+' · '+f.date+'</div></div>'+
      '<div class="fin-amt '+f.type+'">'+(f.type==='income'?'+':'−')+'₼'+f.amount.toFixed(2)+'</div>'+
      '<button class="del-btn" onclick="deleteFinance('+f.id+')">✕</button></div>';
  }).join('');
}

// ══════════════════════════════════════════
// UTIL
// ══════════════════════════════════════════
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ══════════════════════════════════════════
// INIT — IndexedDB açıl, məlumatları oxu
// ══════════════════════════════════════════
function startApp(){
  var keys=['tasks','notes','schedules','habits','finances'];
  var loaded=0;
  function tryRender(){
    loaded++;
    if(loaded===keys.length){
      renderTasks(); renderNotes(); renderSchedule();
      renderHabits(); renderFinance(); renderDashboard(); updateStats();
      document.getElementById('loadingScreen').classList.add('hidden');
    }
  }
  keys.forEach(function(k){
    dbLoad(k, function(val){
      if(k==='tasks'     && val) tasks=val;
      if(k==='notes'     && val) notes=val;
      if(k==='schedules' && val) schedules=val;
      if(k==='habits'    && val) habits=val;
      if(k==='finances'  && val) finances=val;
      tryRender();
    });
  });
}

openDB(startApp);

// ══════════════════════════════════════════
// BİLDİRİŞLƏR — tapşırıq, cədvəl, təlim: 15 dəq əvvəl
// ══════════════════════════════════════════
var REM_MIN=15, notified={};
try{notified=JSON.parse(localStorage.getItem('gp_notified')||'{}');}catch(e){}
function pad2(n){return (n<10?'0':'')+n;}
function lKey(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function remOK(){return 'Notification' in window;}
function updateBell(){
  var b=document.getElementById('bellBtn'); if(!b) return;
  b.classList.toggle('on', remOK()&&Notification.permission==='granted');
}
var bannerTimer=null;
function showBanner(t,b){
  var el=document.getElementById('banner');
  el.innerHTML='<div style="font-size:1.4rem">🔔</div><div><b>'+esc(t)+'</b><span>'+esc(b||'')+'</span></div>';
  el.classList.add('show'); clearTimeout(bannerTimer);
  bannerTimer=setTimeout(function(){el.classList.remove('show');},6000);
}
function fireNotif(title,body){
  showBanner(title,body);
  try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}
  if(!remOK()||Notification.permission!=='granted') return;
  var o={body:body,tag:title+body};
  function legacy(){try{new Notification(title,o);}catch(e){}}
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
    navigator.serviceWorker.getRegistration().then(function(r){
      if(r) r.showNotification(title,o); else legacy();
    }).catch(legacy);
  } else legacy();
}
function askNotif(){
  if(!remOK()){showBanner('Bildiriş dəstəklənmir','Bu brauzer bildirişləri dəstəkləmir');return;}
  if(Notification.permission==='denied'){showBanner('Bildiriş bloklanıb','Brauzer/sayt ayarlarından icazə verin');return;}
  if(Notification.permission==='granted'){fireNotif('Bildirişlər aktivdir',REM_MIN+' dəqiqə əvvəl xatırladacağam');return;}
  Notification.requestPermission().then(function(){
    updateBell();
    if(Notification.permission==='granted') fireNotif('Bildirişlər aktivdir',REM_MIN+' dəqiqə əvvəl xatırladacağam');
  });
}
function checkReminders(){
  var now=new Date(), tk=lKey(now);
  if(notified._d!==tk){notified={_d:tk};}
  var items=[];
  function at(hhmm){var p=hhmm.split(':');var d=new Date();d.setHours(+p[0],+p[1],0,0);return d;}
  tasks.forEach(function(t){if(!t.done&&t.time) items.push({k:'t'+t.id,when:at(t.time),ic:'✓ Tapşırıq',name:t.text});});
  schedules.forEach(function(s){if(s.time) items.push({k:'s'+s.id,when:at(s.time),ic:'🕐 Cədvəl',name:s.name});});
  habits.forEach(function(h){if(h.rawDate){var d=new Date(h.rawDate);if(!isNaN(d)) items.push({k:'h'+h.id+lKey(d),when:d,ic:'📖 Təlim',name:h.name});}});
  var changed=false;
  items.forEach(function(it){
    var diff=(it.when-now)/60000;
    var key=it.k+'@'+lKey(it.when);
    if(diff>0&&diff<=REM_MIN&&!notified[key]){
      notified[key]=1; changed=true;
      fireNotif(it.ic+' · '+Math.ceil(diff)+' dəq sonra', it.name+' ('+pad2(it.when.getHours())+':'+pad2(it.when.getMinutes())+')');
    }
  });
  if(changed){try{localStorage.setItem('gp_notified',JSON.stringify(notified));}catch(e){}}
}
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
setInterval(checkReminders,20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden) checkReminders();});
setTimeout(function(){updateBell();checkReminders();},1500);
</script>
